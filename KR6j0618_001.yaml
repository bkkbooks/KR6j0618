body:
  text: 西天譯經三藏朝散大夫試光祿卿明教大師臣法賢奉詔譯爾時佛告阿難言有陀羅尼名曰妙色乃是三世諸佛同共宣說能與眾生作大利益若復有人聞是陀羅尼生難遭想發勇猛心讀誦受持供養恭敬是人理世獲大福聚晝夜安隱又復有人以大悲心於寂靜處持種種飲食而為出生誦此陀羅尼七遍加持已作如是言我今出生祭於世間一切惡趣諸鬼願食此生者速離惡趣說是言時即三彈指想彼諸鬼得此食者各各飽滿變妙色身發菩提心乃至當來漸成佛果即說陀羅尼曰那謨引婆誐嚩帝引一句蘇嚕播引野二怛他引誐多引野三阿囉曷二合帝引三藐訖三二合沒馱引野四怛𭔞切身他引五唵引蘇嚕蘇嚕六鉢囉二合蘇嚕鉢囉二合蘇嚕七三摩二合囉三摩二合囉八婆囉婆囉九三婆囉三婆囉十薩哩嚩二合必隷二合引多必舍引左引曩引十一阿引賀引囕捺那引彌娑嚩二合引賀引十二爾時阿難聞佛說已歡喜信受作禮而退
